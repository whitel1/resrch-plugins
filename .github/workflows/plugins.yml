name: plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/**"
      - "registry/**"
      - "dist/**"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "scripts/**"
      - "registry/**"
      - "dist/**"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One catalog deployment at a time; a queued push waits instead of cancelling
# a partially uploaded registry.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned rdev revision: the catalog build must be reproducible, and the
  # pinned revision also decides the index serializer the freshness gate
  # compares against. Bump deliberately — push rdev first, then this pin.
  RDEV_REV: dceb40066455887ecabd6a4213894713706abb14

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Both checkouts live side by side inside the workspace, mirroring the
      # local sibling layout: steps run from resrch-plugins/ and reference the
      # app checkout as ../resrch-app, exactly like scripts/check-all.sh does.
      - uses: actions/checkout@v4
        with:
          path: resrch-plugins
      - uses: actions/checkout@v4
        with:
          repository: whitel1/resrch-app
          # No release tags exist yet, so this intentionally floats with the
          # app's default branch: locale coverage must track the live product
          # contract. When app release tags appear, pin to the newest tag.
          path: resrch-app
      - name: Cache the pinned rdev binary
        id: cache-rdev
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rdev
          key: rdev-bin-${{ env.RDEV_REV }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        if: steps.cache-rdev.outputs.cache-hit != 'true'
      - name: Install the pinned rdev toolchain
        if: steps.cache-rdev.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/whitel1/rdev --rev "$RDEV_REV" rdev
      - name: Check every plugin
        working-directory: resrch-plugins
        run: scripts/check-all.sh
      - name: Rebuild and merge the registry index (signed on main)
        working-directory: resrch-plugins
        env:
          # Private half of the catalog signing key; public half:
          # OX3DVL0jACLzomauo5DqJaAt/aZdbrECRVQ8Ng13iSE=
          # Fork PRs never see repo secrets, so pull requests build unsigned
          # and only main deployments must sign.
          PLUGIN_CATALOG_SIGNING_KEY: ${{ secrets.PLUGIN_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          args=(--manifest ../resrch-app/i18n.toml)
          key_file="$RUNNER_TEMP/plugin-catalog-key"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if [ -z "$PLUGIN_CATALOG_SIGNING_KEY" ]; then
              echo "PLUGIN_CATALOG_SIGNING_KEY secret is not configured; the deployable catalog must be signed" >&2
              exit 1
            fi
            printf '%s' "$PLUGIN_CATALOG_SIGNING_KEY" > "$key_file"
            args+=(--signing-key "$key_file" --key-id plugin-catalog-2026-09)
          fi
          rdev plugin index "${args[@]}"
      - name: Verify the catalog with the registry contract
        working-directory: resrch-plugins
        run: |
          set -euo pipefail
          if [ -f registry/index.sig.json ]; then
            rdev plugin index --verify \
              --trusted-key plugin-catalog-2026-09=OX3DVL0jACLzomauo5DqJaAt/aZdbrECRVQ8Ng13iSE=
          else
            rdev plugin index --verify
          fi
      - name: Fail when the committed catalog is stale
        # The catalog (registry/index.json plus pinned dist/ artifacts) is
        # committed on purpose so a fresh clone is deployable; the rebuild
        # above must therefore be a no-op against the committed tree. A dirty
        # tree means someone bumped plugins/ without running and committing
        # the index build — such a deploy would publish artifacts that exist
        # nowhere in git and rotate their digests on every later rebuild.
        working-directory: resrch-plugins
        run: |
          set -euo pipefail
          status="$(git status --porcelain -- registry dist)"
          if [ -n "$status" ]; then
            echo "Rebuilding the catalog changed tracked or committed files:" >&2
            printf '%s\n' "$status" >&2
            echo "Run 'rdev plugin index --manifest <resrch-app>/i18n.toml' locally and" >&2
            echo "commit registry/index.json plus any new dist/*.rplugin." >&2
            exit 1
          fi
      # The in-app marketplace fetches registry/index.json from this site
      # (DEFAULT_REGISTRY_INDEX_URL in resrch-app) and resolves package paths
      # relative to it, so the index and dist/ must ship together.
      - name: Stage the catalog site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: resrch-plugins
        run: |
          mkdir -p _site/registry _site/dist
          cp registry/index.json _site/registry/
          if [ -f registry/index.sig.json ]; then
            cp registry/index.sig.json _site/registry/
          fi
          cp dist/*.rplugin _site/dist/
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload the catalog site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy the catalog site
        id: deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
