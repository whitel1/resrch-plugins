name: plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "scripts/**"
      - "registry/**"
      - "dist/**"
      - ".github/workflows/plugins.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "scripts/**"
      - "registry/**"
      - "dist/**"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One catalog deployment at a time; a queued push waits instead of cancelling
# a partially uploaded registry.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: whitel1/resrch-app
          path: resrch-app
      - name: Install rdev from source
        run: cargo install --locked --git https://github.com/whitel1/rdev rdev
      - name: Check every plugin
        run: scripts/check-all.sh
      - name: Rebuild and merge the registry index (signed on main)
        env:
          # Private half of the catalog signing key; public half:
          # OX3DVL0jACLzomauo5DqJaAt/aZdbrECRVQ8Ng13iSE=
          # Fork PRs never see repo secrets, so pull requests build unsigned
          # and only main deployments must sign.
          PLUGIN_CATALOG_SIGNING_KEY: ${{ secrets.PLUGIN_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          args=(--manifest ../resrch-app/i18n.toml)
          key_file="$RUNNER_TEMP/plugin-catalog-key"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if [ -z "$PLUGIN_CATALOG_SIGNING_KEY" ]; then
              echo "PLUGIN_CATALOG_SIGNING_KEY secret is not configured; the deployable catalog must be signed" >&2
              exit 1
            fi
            printf '%s' "$PLUGIN_CATALOG_SIGNING_KEY" > "$key_file"
            args+=(--signing-key "$key_file" --key-id plugin-catalog-2026-09)
          fi
          rdev plugin index "${args[@]}"
      - name: Verify the catalog with the registry contract
        run: |
          set -euo pipefail
          if [ -f registry/index.sig.json ]; then
            rdev plugin index --verify \
              --trusted-key plugin-catalog-2026-09=OX3DVL0jACLzomauo5DqJaAt/aZdbrECRVQ8Ng13iSE=
          else
            rdev plugin index --verify
          fi
      # The in-app marketplace fetches registry/index.json from this site
      # (DEFAULT_REGISTRY_INDEX_URL in resrch-app) and resolves package paths
      # relative to it, so the index and dist/ must ship together.
      - name: Stage the catalog site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/registry _site/dist
          cp registry/index.json _site/registry/
          if [ -f registry/index.sig.json ]; then
            cp registry/index.sig.json _site/registry/
          fi
          cp dist/*.rplugin _site/dist/
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload the catalog site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy the catalog site
        id: deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
