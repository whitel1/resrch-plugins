categories = ["language"]
description = "Official Traditional Chinese (Taiwan) product language pack: full product coverage with a zh-CN then English fallback chain."
homepage = "https://github.com/whitel1/resrch-plugins"
id = "app.resrch.language-pack-zh-hant"
keywords = ["language", "chinese", "traditional", "taiwanese", "translation"]
license = "MIT"
name = "繁體中文 (Traditional Chinese) Language Pack"
